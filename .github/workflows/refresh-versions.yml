name: refresh-versions

# Build check for huloglobal.com/vendure-plugins/: runs the Python builders
# so a broken build.py / build_manuals.py / build_legal.py shows up as a red
# X. It does NOT deploy, and must not: a checkout of this repository alone
# lacks what deploy.sh builds with (../packages for the changelogs and
# package data, the licence-server file for annual prices, the WordPress
# plugins repo, the main site's theme for pages.css and the thumbnails), so
# anything built here is a partial site. Deploy from the build box with
# ./deploy.sh (see the README), which runs every builder.
#
# Runs on:
#   - push to main (build.py / build_manuals.py / build_legal.py changes)
#   - manual workflow_dispatch
#   - repository_dispatch of type 'plugin-published' (sent by each
#     plugin's publish.yml after `npm publish`)

on:
  push:
    branches: [main]
    paths:
      - build.py
      - build_manuals.py
      - build_legal.py
      - .github/workflows/refresh-versions.yml
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-published]

concurrency:
  group: refresh-versions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log the trigger
        run: |
          echo "Event:   ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Payload: ${{ toJson(github.event.client_payload) }}"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build check (reads live versions from npm; nothing is deployed)
        run: |
          python3 build.py
          python3 build_manuals.py
          python3 build_legal.py

      - name: Show baked versions
        run: cat dist/vendure-plugins/versions.json
